# The plan's Phase 0 has claimed a "CI-able test suite" since the first commit.
# It was CI-able and never in CI, which is a different thing.
#
# Three checks, in increasing order of how long they take to fail:
#   ruff        - style and a few real bug classes (zip length mismatch,
#                 unused locals) that this project has been bitten by
#   check_docs  - every relative link and repo path in the docs resolves.
#                 Documentation drifts every time an experiment lands, and
#                 that drift has produced a wrong cross-reference more than
#                 once here.
#   pytest      - the suite itself
#
# Installing from pyproject alone is deliberate: a dependency that is used but
# not declared works forever on the author's machine and fails on first
# contact with anyone else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release. The project
        # trains on CPU, so no GPU runner is needed for any of this.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install from pyproject only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"

      - name: Lint
        run: ruff check .

      - name: Documentation references resolve
        run: python scripts/check_docs.py

      - name: Tests
        run: pytest -q
