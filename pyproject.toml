[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-nav"
version = "0.1.0"
description = "Learning vision-conditioned navigation policies: a comparative study against classical planning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "imageio>=2.34",
    "rich>=13.0",
]

[project.optional-dependencies]
# Plotting and figure generation for the report.
viz = ["matplotlib>=3.8", "imageio[ffmpeg]>=2.34"]
# Experiment tracking; optional so training runs without a W&B account.
tracking = ["wandb>=0.17"]
# RecurrentPPO, for the recurrent arm of the frame-stacking question
# (configs/algo/ppo_lstm.yaml). Optional because exactly one experiment needs
# it; bounded to the Stable-Baselines3 major it matches.
recurrent = ["sb3-contrib>=2.9,<3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
vision-nav-train = "vision_nav.training.train:main"
vision-nav-eval = "vision_nav.training.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
